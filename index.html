<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keynetic — Type Faster</title>
    <meta
        name="description"
        content="A simple and focused typing experience."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="#index.html" class="logo">Keynetic</a>

        <nav class="nav-links">
            <a href="#index.html">Home</a>
            <a href="#typing">Typing</a>
            <a href="#about">About</a>
        </nav>

        <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
        >
            Themes
        </button>
    </header>


    <main>

        <!-- Hero Screen -->
        <section class="hero-screen" id="hero">

            <div class="hero-inner">

                <div class="hero-content">

                    <p class="hero-label">
                        Typing, simplified
                    </p>

                    <h1>
                        <span
                            class="hero-title"
                            id="hero-title"
                            data-text="Type Without Thinking"
                            aria-label="Type Without Thinking"
                        ></span>
                    </h1>

                    <p class="hero-description">
                        Focus on the words. Let your fingers do the rest.
                    </p>

                    <button
                        class="enter-btn"
                        id="enter-btn"
                    >
                        ENTER
                    </button>

                    <p class="enter-hint">
                        or press Enter
                    </p>

                </div>

                <div class="hero-panel" aria-hidden="true">
                    <p class="hero-panel-title">Last session</p>

                    <div class="hero-panel-row">
                        <span class="hero-panel-label">Speed</span>
                        <span class="hero-panel-value">89 wpm</span>
                    </div>

                    <div class="hero-panel-row">
                        <span class="hero-panel-label">Accuracy</span>
                        <span class="hero-panel-value">98%</span>
                    </div>

                    <div class="hero-panel-row">
                        <span class="hero-panel-label">Streak</span>
                        <span class="hero-panel-value">6 days</span>
                    </div>
                </div>

            </div>

        </section>


        <!-- Typing Interface -->
        <section
            class="typing-screen"
            id="typing"
            hidden
        >

            <section class="typing-area">

                <div class="typing-info"></div>

                <div class="typing-stage">
                    <div
                        class="typing-text"
                        id="typing-text"
                    >
                        Dream is not what you see in sleep, it is the thing which doesn't let you sleep.
                    </div>

                    <input
                        type="text"
                        id="typing-input"
                        class="typing-input"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        aria-label="Type the displayed text"
                    >
                </div>

                <button
                    class="restart-btn"
                    id="restart-btn"
                >
                    Restart
                </button>

            </section>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Keynetic
        </p>

        <div class="footer-links">
            <a href="#about">About</a>
            <a href="#">Privacy</a>
        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
