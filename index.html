<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keynetic — Type Faster</title>
    <meta
        name="description"
        content="A simple and focused typing experience."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->
    <header class="navbar">
        <a href="#index.html" class="logo">Keynetic</a>

        <nav class="nav-links">
            <a href="#typing">Typing</a>
            <a href="#about">About</a>
        </nav>

        <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
        >
            ☼
        </button>
    </header>


    <main>

        <!-- Hero Screen -->
        <section class="hero-screen" id="hero">

            <div class="hero-content">

                <p class="hero-label">
                    TYPING, SIMPLIFIED.
                </p>

                <h1
                    class="hero-title"
                    id="hero-title"
                    data-text="Type Without Thinking"
                    aria-label="Type Without Thinking"
                ></h1>

                <p class="hero-description">
                    Focus on the words. Let your fingers do the rest.
                </p>

                <button
                    class="enter-btn"
                    id="enter-btn"
                >
                    ENTER
                </button>

                <p class="enter-hint">
                    or press Enter
                </p>

            </div>

        </section>


        <!-- Typing Interface -->
        <section
            class="typing-screen"
            id="typing"
            hidden
        >


            <!-- Typing Area -->
            <section class="typing-area">

                <div class="quick-settings">
                    



                </div>


                <div class="typing-stage">
                    <div
                        class="typing-text"
                        id="typing-text"
                    >
                        Dream is not what you see in sleep, it is the thing which doesn't let you sleep.
                
                    </div>

                    <input
                        type="text"
                        id="typing-input"
                        class="typing-input"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        aria-label="Type the displayed text"
                    >
                </div>


                <button
                    class="restart-btn"
                    id="restart-btn"
                >
                    Restart
                </button>

            </section>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Keynetic
        </p>

        <div class="footer-links">
            <a href="#about">About</a>
            <a href="#">Privacy</a>
        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
